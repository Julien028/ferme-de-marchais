<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Affiche QR code – Distributeur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Karla:wght@400;600&display=swap" rel="stylesheet">
<script src="qrcode.js"></script>
<style>
  :root { --vert: #2f7a3a; --ardoise: #343b44; --inox: #e3e7ea; --inox-bord: #b9c1c7; --patate: #e9c46a;
          --police-titre: "Zilla Slab", Rockwell, Georgia, serif; --police-texte: "Karla", "Segoe UI", Arial, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #d9dee2; font-family: var(--police-texte); color: #22272d; }
  .reglages { background: var(--ardoise); color: #fff; padding: 1rem; display: flex; flex-wrap: wrap; gap: 1rem; align-items: end; }
  .reglages label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: .25rem; }
  .reglages input { font: inherit; padding: .5rem .6rem; border-radius: 6px; border: 0; width: min(28rem, 80vw); }
  .reglages a, .reglages button { font: inherit; font-weight: 600; padding: .55rem 1rem; border-radius: 6px; border: 2px solid #fff; background: none; color: #fff; cursor: pointer; text-decoration: none; }
  .reglages button.principal { background: var(--patate); border-color: var(--patate); color: var(--ardoise); }

  /* La feuille A4 */
  .feuille {
    width: 210mm; height: 297mm; margin: 1.5rem auto; background: #fff;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    padding: 18mm 16mm; box-shadow: 0 6px 24px rgba(0,0,0,.2);
  }
  .bandeau { width: 100%; background: var(--vert); color: #fff; border-radius: 6mm; padding: 9mm 8mm; }
  .bandeau h1 { font-family: var(--police-titre); font-size: 34pt; margin: 0 0 3mm; line-height: 1.05; }
  .bandeau p { font-size: 15pt; margin: 0; }
  .qr { margin: 12mm 0 8mm; padding: 14mm;  /* marge blanche autour du code : nécessaire pour une lecture fiable */ border: 2.5mm solid var(--ardoise); border-radius: 5mm; }
  .qr svg { display: block; width: 100mm; height: 100mm; }
  .appel { font-family: var(--police-titre); font-size: 24pt; font-weight: 700; color: var(--ardoise); margin: 0 0 3mm; }
  .sous { font-size: 14pt; margin: 0; color: #56606b; }
  .adresse { margin-top: auto; font-size: 13pt; color: #56606b; word-break: break-all; }
  .pied { margin-top: 5mm; display: flex; gap: 8mm; justify-content: center; font-size: 13pt; font-weight: 600; color: var(--ardoise); }
  .pied span { background: var(--inox); border-radius: 999px; padding: 2mm 6mm; }

  @media print {
    @page { size: A4; margin: 0; }
    body { background: #fff; }
    .reglages { display: none; }
    .feuille { margin: 0; box-shadow: none; }
  }
  @media screen and (max-width: 900px) { .feuille { transform: scale(.45); transform-origin: top center; margin-bottom: -150mm; } }
</style>
</head>
<body>
  <div class="reglages">
    <div>
      <label for="lien">Adresse vers laquelle mène le QR code</label>
      <input id="lien">
    </div>
    <button class="principal" id="imprimer" type="button">Imprimer l'affiche</button>
    <button id="telecharger" type="button">Télécharger le QR code seul</button>
    <a href="./">Retour au site</a>
  </div>

  <div class="feuille">
    <div class="bandeau">
      <h1>Ferme de Marchais</h1>
      <p>Les produits de la ferme, en libre-service</p>
    </div>
    <div class="qr" id="qr"></div>
    <p class="appel">Scannez pour voir tout le distributeur</p>
    <p class="sous">Produits, prix et numéros des casiers, sur votre téléphone</p>
    <p class="adresse" id="adresse-texte"></p>
    <div class="pied"><span>Ouvert 24h/24</span><span>Carte bancaire, avec ou sans contact</span></div>
  </div>

<script>
  // Par défaut, le QR code mène à la partie "produits" de ce site (même adresse que l'administration, sans /admin/).
  const racine = location.href.replace(/affiche\.html.*$/, "");  // adresse du site (sans /admin/)
  const champLien = document.getElementById("lien");
  champLien.value = racine + "#produits";

  function fabriquer() {
    const lien = champLien.value.trim();
    const qr = qrcode(0, "M");          // taille automatique, correction d'erreur moyenne
    qr.addData(lien);
    qr.make();
    document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
    document.getElementById("adresse-texte").textContent = lien.replace(/^https?:\/\//, "").replace(/#.*$/, "").replace(/\/$/, "");
    return qr;
  }
  champLien.addEventListener("input", fabriquer);
  fabriquer();

  document.getElementById("imprimer").addEventListener("click", () => window.print());

  // Télécharge le QR code en image PNG haute définition (pour un autocollant, une étiquette, Facebook…)
  document.getElementById("telecharger").addEventListener("click", () => {
    const qr = fabriquer(), n = qr.getModuleCount(), taille = 40, marge = 4;
    const c = document.createElement("canvas");
    c.width = c.height = (n + marge * 2) * taille;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = "#000";
    for (let l = 0; l < n; l++) for (let k = 0; k < n; k++)
      if (qr.isDark(l, k)) ctx.fillRect((k + marge) * taille, (l + marge) * taille, taille, taille);
    const a = document.createElement("a");
    a.download = "qr-code-distributeur.png";
    a.href = c.toDataURL("image/png");
    a.click();
  });
</script>
</body>
</html>
